<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urazul — Próximamente (Claro)</title>
<meta name="description" content="Compañía Urazul S.A. Próximamente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Inversión de paleta para Light Mode */
    --bg-pure: #ffffff;
    --bg-tint: #f0f4f8;
    --navy-deep: #0a1330;
    --navy-mark: #172454;
    --sage-dark: #4a665f; 
    
    --text-main: #0a1330;
    --text-dim: rgba(10, 19, 48, 0.7); 
    --hairline: rgba(10, 19, 48, 0.15);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-tint);
  }

  body{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    overflow-x: hidden;
    position: relative;
    /* Un gradiente claro, limpio y profesional */
    background:
      radial-gradient(ellipse 120% 60% at 50% 8%, rgba(255,255,255,0.8), transparent 55%),
      linear-gradient(180deg, var(--bg-tint) 0%, #e2e8f0 100%);
  }

  /* Ruido/grano muy sutil adaptado al modo claro para mantener la textura */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.6;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(10,19,48,0.05) 0%, transparent 60%),
      radial-gradient(1px 1px at 78% 24%, rgba(10,19,48,0.03) 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 34% 12%, rgba(10,19,48,0.04) 0%, transparent 60%);
  }

  .page{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
    padding: 9vh 2rem 6vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* Tratamiento del JPG oscuro en fondo claro */
  .mark{
    /* SE AGRANDÓ EL LOGO AQUÍ: pasó de 72vw a 75vw, y de 220px a 260px */
    width: min(75vw, 260px); 
    height: auto;
    margin-bottom: clamp(2.5rem, 7vh, 3.5rem);
    border-radius: 16px; 
    box-shadow: 0 12px 32px rgba(10, 19, 48, 0.12), 0 2px 8px rgba(10, 19, 48, 0.08);
  }

  .headline{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500; 
    font-optical-sizing: auto;
    font-size: clamp(2.6rem, 8vw, 4.4rem);
    line-height: 1;
    letter-spacing: 0.005em;
    color: var(--navy-deep);
    margin: 0;
  }

  .subline{
    margin: 0.9rem 0 0;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--sage-dark);
  }

  /* La línea animada adaptada a colores oscuros */
  .horizon{
    position: relative;
    width: 100%;
    max-width: 460px;
    height: 1px;
    margin: clamp(3rem, 7vh, 4.5rem) 0 clamp(2.6rem, 6vh, 3.6rem);
    background: var(--hairline);
    overflow: visible;
  }

  /* El destello ahora es de un azul marino intenso */
  .horizon::after{
    content: "";
    position: absolute;
    top: 50%;
    left: -20%;
    width: 45%;
    height: 4px;
    transform: translateY(-50%);
    background: linear-gradient(90deg, transparent, var(--navy-mark) 50%, transparent);
    filter: blur(3px);
    opacity: 0.7;
    animation: sweep 9s ease-in-out infinite;
  }

  @keyframes sweep{
    0%   { left: -25%; }
    50%  { left: 80%; }
    100% { left: -25%; }
  }

  .contact{
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--text-dim);
  }

  .contact .company{
    color: var(--navy-deep);
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .contact a{
    color: var(--text-dim);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .contact a:hover,
  .contact a:focus-visible{
    color: var(--navy-mark);
    border-color: var(--navy-mark);
  }

  .contact a:focus-visible{
    outline: 2px solid var(--navy-mark);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .phones{
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .phones span{
    color: rgba(10, 19, 48, 0.3);
  }

  @media (max-width: 420px){
    .page{ padding-top: 7vh; }
    .contact{ font-size: 0.86rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .horizon::after{ animation: none; left: 20%; }
  }
</style>
</head>
<body>

  <main class="page">
    <img class="mark" src="assets/logo.jpg" alt="Urazul">

    <h1 class="headline">Próximamente</h1>
    <p class="subline">Compañía Urazul S.A.</p>

    <div class="horizon" aria-hidden="true"></div>

    <address class="contact">
      <span class="company">Plaza Cagancha 1166</span>
      <span>11400 Montevideo, Uruguay</span>
      <a href="mailto:urazul@urazul.com">urazul@urazul.com</a>
      <span class="phones">
        <a href="tel:+59897888512">+598 97 888 512</a>
        <span>·</span>
        <a href="tel:+59897431509">+598 97 431 509</a>
      </span>
    </address>
  </main>

</body>
</html>
