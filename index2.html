<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urazul — Próximamente (Claro)</title>
<meta name="description" content="Compañía Urazul S.A. Próximamente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Fondo blanco puro para que matchee EXACTAMENTE con el fondo del JPG */
    --bg-pure: #ffffff; 
    
    --navy-deep: #0a1330;
    --navy-mark: #172454;
    --sage-dark: #4a665f; 
    
    --text-main: #0a1330;
    --text-dim: rgba(10, 19, 48, 0.75); 
    --hairline: rgba(10, 19, 48, 0.15);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    /* Se aplica el blanco puro como color sólido */
    background: var(--bg-pure);
  }

  body{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    overflow-x: hidden;
    position: relative;
  }

  .page{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
    padding: 9vh 2rem 6vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* El logo ya no necesita trucos, solo su tamaño ajustado */
  .mark{
    width: min(75vw, 260px); 
    height: auto;
    margin-bottom: clamp(2.5rem, 7vh, 3.5rem);
  }

  .headline{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500; 
    font-optical-sizing: auto;
    font-size: clamp(2.6rem, 8vw, 4.4rem);
    line-height: 1;
    letter-spacing: 0.005em;
    color: var(--navy-deep);
    margin: 0;
  }

  .horizon{
    position: relative;
    width: 100%;
    max-width: 460px;
    height: 1px;
    margin: clamp(3rem, 7vh, 4.5rem) 0 clamp(2.6rem, 6vh, 3.6rem);
    background: var(--hairline);
    overflow: visible;
  }

  /* El destello adaptado a colores oscuros para que se vea sobre el blanco */
  .horizon::after{
    content: "";
    position: absolute;
    top: 50%;
    left: -20%;
    width: 45%;
    height: 4px;
    transform: translateY(-50%);
    background: linear-gradient(90deg, transparent, var(--navy-mark) 50%, transparent);
    filter: blur(3px);
    opacity: 0.8;
    animation: sweep 9s ease-in-out infinite;
  }

  @keyframes sweep{
    0%   { left: -25%; }
    50%  { left: 80%; }
    100% { left: -25%; }
  }

  .contact{
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--text-dim);
  }

  /* Compañía Urazul S.A. en negrita */
  .contact .company-name{
    color: var(--navy-deep);
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .contact a{
    color: var(--text-dim);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .contact a:hover,
  .contact a:focus-visible{
    color: var(--navy-mark);
    border-color: var(--navy-mark);
  }

  .contact a:focus-visible{
    outline: 2px solid var(--navy-mark);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .phones{
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .phones span{
    color: rgba(10, 19, 48, 0.3);
  }

  @media (max-width: 420px){
    .page{ padding-top: 7vh; }
    .contact{ font-size: 0.86rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .horizon::after{ animation: none; left: 20%; }
  }
</style>
</head>
<body>

  <main class="page">
    <img class="mark" src="assets/logo.jpg" alt="Urazul">

    <h1 class="headline">Próximamente</h1>

    <div class="horizon" aria-hidden="true"></div>

    <address class="contact">
      <span class="company-name">Compañía Urazul S.A.</span>
      <span>Plaza Cagancha 1166</span>
      <span>11400 Montevideo, Uruguay</span>
      <a href="mailto:urazul@urazul.com">urazul@urazul.com</a>
      <span class="phones">
        <a href="tel:+59897888512">+598 97 888 512</a>
        <span>·</span>
        <a href="tel:+59897431509">+598 97 431 509</a>
      </span>
    </address>
  </main>

</body>
</html>
